name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Ensure C toolchain for CGO (go-sqlite3)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev
      - name: Owning gate (fmt, vet, mod verify, race tests, build)
        run: make check
      - name: govulncheck (advisory)
        continue-on-error: true
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ''
          go-package: ./...
