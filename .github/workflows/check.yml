name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Ensure C toolchain for CGO (go-sqlite3)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev
      - name: Owning gate (fmt, vet, mod verify, race tests, build)
        run: make check
      - name: govulncheck (advisory)
        continue-on-error: true
        run: mise exec -- go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
